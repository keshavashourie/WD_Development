        <div role="main" id="mc-main-content">
            <p class="Head2">查看联机帮助</p>
            <p class="_1body">可以通过单击 Portal Studio 全局工具栏上的“帮助”按钮来查看 Portal Studio 的联机帮助。</p>
            <p class="_1body" data-mc-conditions="Default.ScreenOnly"><a name="When_Viewing_Online_Help"></a>
            </p>
            <div class="MCDropDown MCDropDown_Closed dropDown"><span class="MCDropDownHead dropDownHead"><a href="javascript:void(0)" class="MCDropDownHotSpot dropDownHotspot MCDropDownHotSpot_ MCHotSpotImage" aria-expanded="false"><img class="MCDropDown_Image_Icon" src="../../Skins/Default/Stylesheets/Images/transparent.gif" height="11" width="16" alt="关闭" data-mc-alt2="打开" />在查看联机帮助时</a></span>
                <div class="MCDropDownBody dropDownBody">
                    <p class="_1body">联机帮助在浏览器中将显示为弹出窗口。如果有已翻译版本的帮助，帮助会以浏览器中设置的首选语言显示。默认情况下，帮助以英语显示。确保已为首选语言安装了最新的语言包。</p>
                </div>
            </div>
            <p class="Head3-Side"><a name="How_to_View_Online_Help"></a>如何查看联机帮助</p>
            <p class="_1body">按照以下步骤查看联机帮助：</p>
            <table class="AutoNumber_p_Step1" style="width: 100%; margin-left: 0;" cellspacing="0" cellpadding="0">
                <col style="width: 45px;" />
                <col style="width: 30px;" />
                <col style="width: auto;" />
                <tr>
                    <td valign="top" />
                    <td class="AutoNumber_p_Step1" valign="top"><span class="Number"><b>1.</b></span>
                    </td>
                    <td class="AutoNumber_p_Step1" valign="top" data-mc-autonum="&lt;b&gt;1.&lt;/b&gt;">访问 Portal Studio。</td>
                </tr>
            </table>
            <table class="AutoNumber_p_Step1" style="width: 100%; margin-left: 0;" cellspacing="0" cellpadding="0">
                <col style="width: 45px;" />
                <col style="width: 30px;" />
                <col style="width: auto;" />
                <tr>
                    <td valign="top" />
                    <td class="AutoNumber_p_Step1" valign="top"><span class="Number"><b>2.</b></span>
                    </td>
                    <td class="AutoNumber_p_Step1" valign="top" data-mc-autonum="&lt;b&gt;2.&lt;/b&gt;">单击<span class="User_Entry">帮助</span>。<span class="Emphasis">将显示浏览器弹出窗口，该窗口显示 Portal Studio 联机帮助。</span></td>
                </tr>
            </table>
            <p>&#160;</p>
