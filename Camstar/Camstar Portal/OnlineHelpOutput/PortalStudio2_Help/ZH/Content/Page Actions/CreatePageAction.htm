            <p class="Head2NoBreak" data-mc-conditions="Default.ScreenOnly">页面操作</p>
            <p class="_1body">页面操作是可以在门户页面上完成的操作。例如，容器关闭是一个操作，使用该操作可以关闭在页面上选定的容器。页面操作显示为链接或按钮，并可以自定义为在某些条件满足时显示。</p>
