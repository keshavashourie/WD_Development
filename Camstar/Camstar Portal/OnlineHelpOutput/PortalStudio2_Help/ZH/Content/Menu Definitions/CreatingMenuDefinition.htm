            <p class="Head2NoBreak" data-mc-conditions="Default.ScreenOnly">导航组件：菜单和选项卡</p>
            <p class="_1body">Siemens 默认在实施中提供标准门户菜单选项。可以自定义菜单或创建自己的菜单，以满足组织的各种需求。通过自定义和创建菜单以及选项卡，可以控制可访问的门户页面和事务。 </p>
