            <p class="Head2" data-mc-conditions="Default.ScreenOnly">工作控制定义</p>
            <p class="_1body" style="color: #000000;">工作控制模块提供定义、启动、计划和追踪制造资源修复和维护工作的功能。每个工作由使用“工作模型”对象配置的工作流程组成。</p>
            <p class="_1body" style="color: #000000;">有关信息，请参见《<i>Opcenter Execution Core Shop Floor 指南</i>》。 </p>
