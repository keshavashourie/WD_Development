            <p class="Head2" data-mc-conditions="Default.ScreenOnly">工具定义</p>
            <p class="_1body" style="color: #000000;">工具是一种设备资源。工具管理可用于定义工具、工具系列、工具组、工具计划和工具矩阵。工具计划将指派给设备资源，以便应用程序可以在移入之前验证资源。还可以为应用程序定义工具计划矩阵，以根据运行时准则动态选择工具计划。</p>
            <p class="_1body" style="color: #000000;">此图显示工具管理的建模流程。 </p>
            <p class="_1body">
                <img src="../Resources/Images/tool_modeling_sequence.png" />
            </p>
