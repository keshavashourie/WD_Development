            <p class="Head2" data-mc-conditions="Default.ScreenOnly">事件记录</p>
            <p class="_1body">通用事件记录功能使用户可以记录容器或产品的分发。通常，针对尚未输入到应用程序中的物料记录通用事件。例如，在来料检验过程中，检查员确定一批晶元超出厚度规范。检查员将不会启动或分发这些晶元，但可以记录通用事件用于质量追踪目的。</p>
            <p class="_1body">然后将审核通用事件以确定进一步的操作。如果确定它们为非分发，无需进一步处理即可解决，也可以关闭事件。</p>
