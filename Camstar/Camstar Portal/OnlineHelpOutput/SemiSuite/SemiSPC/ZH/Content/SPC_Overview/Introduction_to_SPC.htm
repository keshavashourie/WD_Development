            <p class="Head2NoBreak" data-mc-conditions="Default.ScreenOnly">SPC 概述</p>
            <p class="_1body">Opcenter Execution Semiconductor Statistical Process Control (SPC) 模块在制造流程中执行，以根据配置准则标识实际和潜在的产品质量问题。</p>
            <p class="_1body"> 内联 SPC 当前使用内部 Siemens 服务器来执行统计数据分析和制图系统。控制图表是 Inline SPC 提供的一种机制，用于帮助监视和控制质量和生产量。Inline SPC 计算引擎提供了各种控制图表，可以根据特殊需求量身定制。</p>
