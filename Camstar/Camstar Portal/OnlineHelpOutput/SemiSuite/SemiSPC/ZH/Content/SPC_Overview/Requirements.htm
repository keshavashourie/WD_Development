            <p class="Head2-Preface"><a name="kanchor15"></a>必要条件</p>
            <p class="_1body">对于原有 SPC，该解决方案要求在制造现场安装 SPC 模块和 Statit e-Server。必须配置 SPC 建模对象。通常使用 SPC 随附的安装电子表格，然后使用 SPC 建模对象页进行一些手动更新来完成该操作。此外，必须为 SPC 填充工厂对象 XML 客户端连接字段。</p>
            <p class="_1body">有关内联 SPC 的更多信息，参考本指南中的<a href="Inline_SPC.htm" class="MCXref xref" xrefformat="{paratext}">Inline SPC</a> 和<a href="../SPC_Modeling/Inline SPC_Required_Modeling.htm" class="MCXref xref" xrefformat="{paratext}">Inline SPC 所需的建模对象</a>。 </p>
