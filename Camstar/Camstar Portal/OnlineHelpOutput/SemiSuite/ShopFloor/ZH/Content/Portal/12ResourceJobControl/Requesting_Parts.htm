        <div role="main" id="mc-main-content">
            <p class="Head2"><a name="kanchor518"></a><a name="kanchor519"></a>请求零件</p>
            <p class="_1bodyKeepWithNext">使用“工作进度”页时，技术员可以通过单击“零件请求”以显示“零件请求”弹出窗口来请求零件。有关信息，请参考“<a href="../Parts/Part_Request.htm" class="MCXref xref" xrefformat="{paratext}">零件请求</a>”。</p>
            <p class="Head3-Side"><a name="How_Part_Requests_are_Processed"></a>如何处理零件请求<a name="kanchor520"></a></p>
            <p class="_1bodyKeepWithNext">以下是处理零件请求所需的操作序列：</p>
            <table class="AutoNumber_p_Step1" style="width: 100%; margin-left: 0;" cellspacing="0" cellpadding="0">
                <col style="width: 45px;" />
                <col style="width: 30px;" />
                <col style="width: auto;" />
                <tr>
                    <td valign="top" />
                    <td class="AutoNumber_p_Step1" valign="top"><span class="Number"><b>1.</b></span>
                    </td>
                    <td class="AutoNumber_p_Step1" valign="top" data-mc-autonum="&lt;b&gt;1.&lt;/b&gt;">库存必须使用“零件请求确认”事务确认请求。</td>
                </tr>
            </table>
            <table class="AutoNumber_p_Step1" style="width: 100%; margin-left: 0;" cellspacing="0" cellpadding="0">
                <col style="width: 45px;" />
                <col style="width: 30px;" />
                <col style="width: auto;" />
                <tr>
                    <td valign="top" />
                    <td class="AutoNumber_p_Step1" valign="top"><span class="Number"><b>2.</b></span>
                    </td>
                    <td class="AutoNumber_p_Step1" valign="top" data-mc-autonum="&lt;b&gt;2.&lt;/b&gt;">库存必须使用“零件请求指派”事务将一个或多个零件指派给工作。</td>
                </tr>
            </table>
            <table class="AutoNumber_p_Step1" style="width: 100%; margin-left: 0;" cellspacing="0" cellpadding="0">
                <col style="width: 45px;" />
                <col style="width: 30px;" />
                <col style="width: auto;" />
                <tr>
                    <td valign="top" />
                    <td class="AutoNumber_p_Step1" valign="top"><span class="Number"><b>3.</b></span>
                    </td>
                    <td class="AutoNumber_p_Step1" valign="top" data-mc-autonum="&lt;b&gt;3.&lt;/b&gt;">库存必须使用“零件请求完成”事务完成请求。</td>
                </tr>
            </table>
            <table class="AutoNumber_p_Step1" style="width: 100%; margin-left: 0;" cellspacing="0" cellpadding="0">
                <col style="width: 45px;" />
                <col style="width: 30px;" />
                <col style="width: auto;" />
                <tr>
                    <td valign="top" />
                    <td class="AutoNumber_p_Step1" valign="top"><span class="Number"><b>4.</b></span>
                    </td>
                    <td class="AutoNumber_p_Step1" valign="top" data-mc-autonum="&lt;b&gt;4.&lt;/b&gt;">技术员必须使用“零件分发”事务分发零件。</td>
                </tr>
            </table>
            <table class="AutoNumber_p_Note1body" style="margin-top: 12px; width: 100%; margin-left: 0;" cellspacing="0" cellpadding="0">
                <col style="width: 21px;" />
                <col style="width: 40px;" />
                <col style="width: auto;" />
                <tr>
                    <td valign="top" />
                    <td class="AutoNumber_p_Note1body" valign="top"><span class="Note"><span style="font-family: 'Arial';" class="mcFormatFamily"><b><span style="color: #006487;" class="mcFormatColor">注释:</span></b></span></span>
                    </td>
                    <td class="AutoNumber_p_Note1body" valign="top" data-mc-autonum="&lt;span style=&quot;font-family: 'Arial';&quot; class=&quot;mcFormatFamily&quot;&gt;&lt;b&gt;&lt;span style=&quot;color: #006487;&quot; class=&quot;mcFormatColor&quot;&gt;注释:&lt;/span&gt;&lt;/b&gt;&lt;/span&gt;">必须先进行这些操作，然后主管才可以对包含零件请求的工作执行“工作完成”事务。</td>
                </tr>
            </table>
