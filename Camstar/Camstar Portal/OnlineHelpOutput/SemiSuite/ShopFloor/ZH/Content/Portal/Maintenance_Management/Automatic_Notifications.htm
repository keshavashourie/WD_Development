        <div role="main" id="mc-main-content">
            <p class="Head2">自动维护通知<a name="kanchor139"></a></p>
            <p class="_1body">默认情况下，<span class="mc-variable Variables.ProductName variable">Opcenter Execution Semiconductor</span>将防止设备使用、发起已配置的维护通知，并在“WIP 主要”操作员尝试“转入”维护已逾期或在定义的警告期限内将到期的设备时创建配置的维护工作。通过将业务规则配置为在维护将到期时自动发送电子邮件通知并创建维护工作，而不是等待操作员与用户界面进行交互，可以提高日期和重复日期要求的流程效率。</p>
