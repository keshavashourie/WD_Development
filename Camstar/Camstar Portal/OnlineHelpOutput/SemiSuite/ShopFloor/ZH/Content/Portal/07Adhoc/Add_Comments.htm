            <p class="Head2"><a name="kanchor544"></a>添加注释</p>
            <p class="_1body">“添加注释”用于手动为资源添加注释。</p>
            <p class="_1body" data-mc-conditions="Default.ScreenOnly"><a name="Add_Comments_Page_Field_Definitions"></a>
            </p>

                <div class="MCDropDownBody dropDownBody">
                    <p class="_1bodyKeepWithNext">此表定义“添加注释”页中的字段。</p>
                    <table style="width: 95%;mc-table-style: url('../../Resources/TableStyles/Horiz-rules_Table.css');" class="TableStyle-Horiz-rules_Table" cellspacing="0">

                                </td>
                            </tr>
                        </thead>
                        <tbody>
                            <tr class="TableStyle-Horiz-rules_Table-Body-Body1">
                                <td class="TableStyle-Horiz-rules_Table-BodyE-Column1-Body1">
                                    <p class="CellBody">批次</p>
                                </td>
                                <td class="TableStyle-Horiz-rules_Table-BodyD-Column1-Body1">
                                    <p class="CellBody">此必需字段指定注释的批次。</p>
                                </td>
                            </tr>
                            <tr class="TableStyle-Horiz-rules_Table-Body-Body2">
                                <td class="TableStyle-Horiz-rules_Table-BodyE-Column1-Body2">
                                    <p class="CellBody">员工</p>
                                </td>
                                <td class="TableStyle-Horiz-rules_Table-BodyD-Column1-Body2">
                                    <p class="CellBody">执行此事务的员工（如果不同于当前登录的用户）。</p>
                                </td>
                            </tr>
                            <tr class="TableStyle-Horiz-rules_Table-Body-Body1">
                                <td class="TableStyle-Horiz-rules_Table-BodyE-Column1-Body1">
                                    <p class="CellBody">最近注释</p>
                                </td>
                                <td class="TableStyle-Horiz-rules_Table-BodyD-Column1-Body1">
                                    <p class="CellBody">此字段指定要添加的注释。每个事务都需要不同于上一个值的值。可以设置空字符串以清除现有注释。</p>
                                    <p class="CellBody">最近的值将存储在“批次”的“注释”字段中。</p>
                                </td>
                            </tr>
                            <tr class="TableStyle-Horiz-rules_Table-Body-Body2">
                                <td class="TableStyle-Horiz-rules_Table-BodyB-Column1-Body2">

                                <td class="TableStyle-Horiz-rules_Table-BodyA-Column1-Body2">
                                    <p class="CellBody">返回作为选择值为“批次”输入的最近几个注释。如果未定义“结果集大小限制”，将返回最近 200 个注释。</p>
                                </td>
                            </tr>
