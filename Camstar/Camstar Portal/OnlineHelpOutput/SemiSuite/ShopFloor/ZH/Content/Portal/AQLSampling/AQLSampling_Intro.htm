        <div role="main" id="mc-main-content">
            <p class="Head2" data-mc-conditions="Default.ScreenOnly">AQL 采样概述</p>
            <p class="_1body">Opcenter Execution Semiconductor Shop Floor“WIP 主要”页会提供相关采样数据以供审核。还可以根据采样要求收集批次的采样数据。</p>
            <p class="_1body">在制造流程中，采样检验是一种统计学做法，即通过为批次建模和执行采样计划来估计生产质量。这种做法通常会测试部分批次而不是测试整个批次。可接受质量标准 (AQL) 采样计划定义了所需的样本数量（采样率）和相关的验收与拒绝标准。 </p>
            <p class="_1bodyKeepWithNext" data-mc-conditions="">
