        <div role="main" id="mc-main-content">
            <p class="Head2">多级别 WIP 处理<a name="kanchor378"></a></p>
            <p class="_1body">使用“多级别开始”创建的批次基于数量。“数量 2”总是为零。这些批次无法通过基于项的工步进行处理。</p>
            <p class="_1body">通过“WIP 主要”追踪父批次，直至达到在配置时选择了“是多级别拆分”的工步。此工步要求子批次与父批次取消关联或与父批次拆分开来。如果该工步在配置时还选择了“自动多级别拆分”，则会自动执行拆分。否则，必须使用“取消关联”页手动将父批次与子批次拆分开来。</p>
            <p class="_1body">已取消关联的父项将自动移到配置为“多级别集合工作流程工步”的工步。在所有子批次都重新关联之前，不能移动或追踪父批次。</p>
