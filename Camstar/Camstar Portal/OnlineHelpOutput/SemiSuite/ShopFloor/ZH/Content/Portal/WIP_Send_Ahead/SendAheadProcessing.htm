        <div role="main" id="mc-main-content">
            <p class="Head2" data-mc-conditions="Default.ScreenOnly">预先发送处理</p>
            <p class="_1body"><a name="kanchor288"></a>预先发送处理是一个 WIP 流程，设计用于在处理剩余部分之前测试从一个或多个母批次创建的小批次。此流程使制造商可以在发布一个或多个批次的剩余部分之前检测并解决问题。测试批次称为预先发送批次。当以最基本形式出现时，预先发送批次包含从一个母批次拆分的一个试作晶元。还可以实施基于数量的预先发送流程。</p>
