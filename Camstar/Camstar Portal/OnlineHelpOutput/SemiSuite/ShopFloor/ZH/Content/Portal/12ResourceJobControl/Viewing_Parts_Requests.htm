        <div role="main" id="mc-main-content">
            <p class="Head2"><a name="viewing_parts_requests"></a><a name="kanchor280"></a>查看零件请求</p>
            <p class="_1body">可以从“主管工作”页和“技术员工作”页查看对所选工作请求的零件，方法是在“搜索结果”表格的所选行上单击“资源零件”图标。</p>
            <p class="Head3-Side"><a name="how_to_view_resource_parts"></a>如何查看零件请求<a name="kanchor281"></a></p>
            <p class="_1bodyKeepWithNext">按照以下步骤从“主管工作”页和“技术员工作”页查看零件请求：</p>
            <table class="AutoNumber_p_Step1" style="width: 100%; margin-left: 0;" cellspacing="0" cellpadding="0">
                <col style="width: 45px;" />
                <col style="width: 30px;" />
                <col style="width: auto;" />
                <tr>
                    <td valign="top" />
                    <td class="AutoNumber_p_Step1" valign="top"><span class="Number"><b>1.</b></span>
                    </td>
                    <td class="AutoNumber_p_Step1" valign="top" data-mc-autonum="&lt;b&gt;1.&lt;/b&gt;">在“搜索结果”表格上选择工作对应的行。</td>
                </tr>
            </table>
            <table class="AutoNumber_p_Step1" style="width: 100%; margin-left: 0;" cellspacing="0" cellpadding="0">
                <col style="width: 45px;" />
                <col style="width: 30px;" />
                <col style="width: auto;" />
                <tr>
                    <td valign="top" />
                    <td class="AutoNumber_p_Step1" valign="top"><span class="Number"><b>2.</b></span>
                    </td>
                    <td class="AutoNumber_p_Step1" valign="top" data-mc-autonum="&lt;b&gt;2.&lt;/b&gt;">单击所选行上的<span class="User_Entry">资源零件</span>图标。<span class="Emphasis">应用程序将显示所选工作的“资源零件”弹出窗口。</span></td>
                </tr>
            </table>
