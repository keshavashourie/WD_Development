        <div role="main" id="mc-main-content">
            <p class="Head2">转入维护到期的设备</p>
            <p class="_1body">默认情况下，无法转入维护到期的设备。两个维护要求配置选项（“免除”和“延迟”）为 WIP 主要操作员提供了某种变通方法。</p>
            <p class="_1body" data-mc-conditions="Default.ScreenOnly"><a name="waiving_outstanding_maintenance_req"></a>
            </p>
            <div class="MCDropDown MCDropDown_Closed dropDown"><span class="MCDropDownHead dropDownHead"><a href="javascript:void(0)" class="MCDropDownHotSpot dropDownHotspot MCDropDownHotSpot_ MCHotSpotImage" aria-expanded="false"><img class="MCDropDown_Image_Icon" src="../../../Skins/Default/Stylesheets/Images/transparent.gif" height="11" width="16" alt="关闭" data-mc-alt2="打开" />免除未完成的维护要求</a></span>
                <div class="MCDropDownBody dropDownBody">
                    <p class="_1body">如果为维护要求配置了“免除”选项，则 WIP 主要操作员可以免除对资源到期的已计划维护。如果免除要求，意味着不必执行对特定资源到期的要求。这不会影响同一个要求将来对同一个资源再次变为到期的实例。</p>
                </div>
            </div>
            <p class="_1body" data-mc-conditions="Default.ScreenOnly"><a name="delaying_outstanding_maintenance_req"></a>
            </p>
            <div class="MCDropDown MCDropDown_Closed dropDown"><span class="MCDropDownHead dropDownHead"><a href="javascript:void(0)" class="MCDropDownHotSpot dropDownHotspot MCDropDownHotSpot_ MCHotSpotImage" aria-expanded="false"><img class="MCDropDown_Image_Icon" src="../../../Skins/Default/Stylesheets/Images/transparent.gif" height="11" width="16" alt="关闭" data-mc-alt2="打开" />延迟未完成的维护要求</a></span>
                <div class="MCDropDownBody dropDownBody">
                    <p class="_1body">如果为维护要求配置了“延迟”选项并且未超过已配置的最大值，则 WIP 主要操作员可以延迟对资源到期的已计划维护。有关信息，请参考“<a href="../06WIP_Main/WIPMain_ModifyMaintenanceTab.htm" class="MCXref xref" xrefformat="{paratext}">修改维护</a>”。</p>
                </div>
            </div>
