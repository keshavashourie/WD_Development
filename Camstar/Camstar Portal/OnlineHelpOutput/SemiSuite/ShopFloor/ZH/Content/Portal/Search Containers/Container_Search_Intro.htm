            <p class="Head2" data-mc-conditions="Default.ScreenOnly">容器的搜索</p>
            <p class="_1body">“容器搜索”是一个 Opcenter Execution Core 功能，通过此功能可以基于特定的准则来搜索和检索容器。可以使用提供的过滤器或用户定义的查询来搜索当前和历史容器数据。应用程序返回符合特定准则的容器时，可以选择要在其中执行事务的一个或多个容器。应用程序仅显示与选定容器相关的事务。</p>
