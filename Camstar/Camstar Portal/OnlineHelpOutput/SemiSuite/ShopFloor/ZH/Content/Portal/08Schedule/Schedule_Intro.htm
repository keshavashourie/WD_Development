            <p class="Head2" data-mc-conditions="Default.ScreenOnly">计划事务页面概述</p>
            <p class="_1body">计划是指为批次做好生产准备的流程。各批次都必须具有计划才能从库存继续移动到 WIP。在批次通过 WIP 的过程中，应用程序将创建一个对象来存储该批次的信息。这些信息控制批次如何通过 WIP，并且会在批次完成 WIP 处理后传输到历史。</p>
            <p class="_1body" data-mc-conditions="Default.ScreenOnly">以下主题提供了详细信息：</p>
