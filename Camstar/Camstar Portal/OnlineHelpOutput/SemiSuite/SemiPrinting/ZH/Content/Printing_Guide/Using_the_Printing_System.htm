            <p class="Head2" data-mc-conditions="Default.ScreenOnly">使用 Opcenter Execuption Semiconductor 打印系统</p>
            <p class="_1body">Opcenter Execution Semiconductor 打印系统可在成功完成车间事务后自动打印标签、报告和文本文件。还支持使用 Semiconductor Portal 特别事务打印选项手动生成相同的输出。手动打印选项在自动打印请求失败或输出丢失时非常有用。<a name="kanchor33"></a></p>
            <p class="_1body">本章重点介绍特别打印选项。</p>
