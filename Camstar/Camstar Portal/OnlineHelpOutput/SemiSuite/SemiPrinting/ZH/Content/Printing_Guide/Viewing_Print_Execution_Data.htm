        <div role="main" id="mc-main-content">
            <p class="Head2">查看打印执行数据</p>
            <p class="_1body">不得使用打印数据建模页对打印数据进行建模。它可用于查看打印工作执行数据。</p>
            <p class="Head3-Side">如何查看打印数据<a name="how_to_view_print_data"></a></p>
            <p class="_1bodyKeepWithNext">按照以下步骤查看打印数据：</p>
            <table class="AutoNumber_p_Step1" style="width: 100%; margin-left: 0;" cellspacing="0" cellpadding="0">
                <col style="width: 45px;" />
                <col style="width: 30px;" />
                <col style="width: auto;" />
                <tr>
                    <td valign="top" />
                    <td class="AutoNumber_p_Step1" valign="top"><span class="Number"><b>1.</b></span>
                    </td>
                    <td class="AutoNumber_p_Step1" valign="top" data-mc-autonum="&lt;b&gt;1.&lt;/b&gt;">打开<span class="User_Entry">打印数据</span>页。<span class="Emphasis">随即“建模”页中将显示“打印数据”页。</span></td>
                </tr>
            </table>
            <table class="AutoNumber_p_Step1" style="width: 100%; margin-left: 0;" cellspacing="0" cellpadding="0">
                <col style="width: 45px;" />
                <col style="width: 30px;" />
                <col style="width: auto;" />
                <tr>
                    <td valign="top" />
                    <td class="AutoNumber_p_Step1" valign="top"><span class="Number"><b>2.</b></span>
                    </td>
                    <td class="AutoNumber_p_Step1" valign="top" data-mc-autonum="&lt;b&gt;2.&lt;/b&gt;">在<span class="User_Entry">打印数据</span>字段中输入打印数据名称。<span class="Emphasis">将显示打印数据</span>。<a name="viewing_print_execution_data_page_end"></a></td>
                </tr>
            </table>
