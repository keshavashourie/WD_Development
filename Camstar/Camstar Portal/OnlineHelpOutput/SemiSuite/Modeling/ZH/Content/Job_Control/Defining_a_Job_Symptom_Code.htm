            <p class="Head2">定义工作症状代码<a name="kanchor74"></a></p>
            <p class="_1body">“工作症状代码”表示可能需要修复的制造资源的行为或条件。</p>
            <p class="Head3-Side"><a name="How_to_define_job_symptom_code"></a>如何定义工作症状代码<a name="kanchor75"></a></p>
            <p class="_1bodyKeepWithNext">按照以下步骤定义“工作症状代码”：</p>
            <table class="AutoNumber_p_Step1" style="width: 100%; margin-left: 0;" cellspacing="0" cellpadding="0">

                    <td valign="top" />

                    </td>
                    <td class="AutoNumber_p_Step1" valign="top" data-mc-autonum="&lt;b&gt;1.&lt;/b&gt;">打开<span class="User_Entry">工作症状代码</span>页。<span class="Emphasis">随即“建模”页中将显示“工作症状代码”页。</span></td>
                </tr>
            </table>
            <table class="AutoNumber_p_Step1" style="width: 100%; margin-left: 0;" cellspacing="0" cellpadding="0">

                    </td>
                    <td class="AutoNumber_p_Step1" valign="top" data-mc-autonum="&lt;b&gt;2.&lt;/b&gt;">单击<span class="User_Entry">新建</span>。<span class="Emphasis">显示用于定义新实例的空白字段。</span></td>
                </tr>
            </table>
            <table class="AutoNumber_p_Step1" style="width: 100%; margin-left: 0;" cellspacing="0" cellpadding="0">
                <col style="width: 45px;" />
                <col style="width: 30px;" />
                <col style="width: auto;" />
                <tr>
                    <td valign="top" />
                    <td class="AutoNumber_p_Step1" valign="top"><span class="Number"><b>3.</b></span>
                    </td>
                    <td class="AutoNumber_p_Step1" valign="top" data-mc-autonum="&lt;b&gt;3.&lt;/b&gt;">在<b>工作症状代码</b>字段中输入名称。<span class="Emphasis">这可以是一个描述性名称，而不是仅仅是一个代码。</span></td>
                </tr>
