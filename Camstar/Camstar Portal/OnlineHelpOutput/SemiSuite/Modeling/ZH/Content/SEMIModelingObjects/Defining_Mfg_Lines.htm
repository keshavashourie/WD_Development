            <p class="Head2"><a name="top"></a>定义 SM 生产线<a name="kanchor444"></a></p>
            <p class="_1body">“生产线”是处理批次的设备组。具有所指派生产线的批次必须使用同一生产线的设备处理。使用“生产线”页定义生产线。</p>
            <p class="Head3-Side"><a name="How_to_Define_a_Mfg_Line"></a>如何定义 SM 生产线<a name="kanchor445"></a></p>
            <p class="_1bodyKeepWithNext">按照以下步骤定义 SM 生产线：</p>

                </tr>
            </table>
