            <p class="Head2">定义流程规范和补充规范</p>
            <p class="_1body">流程规范为车间中的批次制造指定了特定于工作流程和工步的处理。补充规范参考流程规范，通过补充规范，可以为所参考的流程规范中的任何工步指定其他处理。流程规范建模对象和补充规范建模对象的定义方式类似。以下链接指向各自的对象定义帮助页面。</p>
