            <p class="Head2">指定预先发送要求的规范<a name="kanchor174"></a></p>
            <p class="_1body">“需要预先发送”规范配置用于防止母批次在已创建预先发送批次之前移出。 </p>
            <p class="Head3-Side">如何指定需要预先发送规范<a name="kanchor175"></a></p>
            <p class="_1body">按照以下步骤指定要用作“需要预先发送”规范的规范：</p>
