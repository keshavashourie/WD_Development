                <div class="MCDropDownBody dropDownBody">
                    <p class="_1body">“过滤器”字段可用于缩小实例列表中出现的大量建模实例。可以对已修订或已命名数据对象使用过滤列表。</p>
                    <p class="_1body">键入一段字符串并单击“刷新”将显示其名称以字符串片段开始的实例列表。在“过滤器”字段为空白的情况下，单击“刷新”将归还所有实例。</p>
                    <p class="_1body">如果已定义实例的数字大于 100，则列表控件将显示在过滤器下方。 </p>
