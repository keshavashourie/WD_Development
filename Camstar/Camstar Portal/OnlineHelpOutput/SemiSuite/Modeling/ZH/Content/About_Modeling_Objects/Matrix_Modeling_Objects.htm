        <div role="main" id="mc-main-content">
            <p class="Head2"><a name="About_Matrix_Modeling_Objects"></a><a name="kanchor44"></a>关于矩阵建模对象</p>
            <p class="_1body">应用程序会使用矩阵建模对象来确定与对象定义的准则匹配的批次行为。可以使用矩阵建模对象为批次指定在制造流程中需要经过的限制和其他条件。在生产流程中，应用程序会评估指定的准则，从而根据上下文确定操作过程。  </p>
            <p class="_1body">例如，通过“WIP 指示”矩阵建模对象可以根据一组准则（如规范和所有者）配置向操作员显示的消息。在这种情况下，可以将应用程序配置为在工程批次移动到特定库存工步时警告操作员。</p>
            <p class="_1body">有关矩阵建模对象的信息，请参考“<a href="../SEMI_Matrix/Matrix_Definitions_Intro.htm" class="MCXref xref" xrefformat="{paratext}">矩阵建模定义</a>”。</p>
