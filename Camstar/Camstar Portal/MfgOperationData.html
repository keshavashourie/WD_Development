<div id="mfgoperation-main" class="mfgoperation">
    <div class="mfgoperation-empty-state" id="mfgoperation-emp-state" style="display: inline-flex;">
        <canvas id="mfgoperation-empty-state-img"></canvas>
        <div id="mfgoperation-empty-state-text" class="mfgoperation-empty-state-txt"></div>
    </div>
    <div id="mfgoperation-content">
        <div id="mfgoperation-material" class="mfgOperation-details-container mfgoperation-tile" style="overflow-y: hidden">
            <div id="mfgoperation-material-header" class="header">
                <span class="material">&nbsp;</span>
                <span id="mfgoperation-material-requirements" class="title">Material Requirements</span>
                <div class="input mfgoperation-hide-non-requirement" id="mfgoperation-hide-non-requirement-checkbox">
                    <span id="mfgoperation-hide-non-requirement-span" class="cs-checkbox mfgoperation-checkbox">
                        <input type="checkbox" id="mfgoperation-hide-non-requirement" name="mfgoperation-hide-non-requirement" />
                        <label for="mfgoperation-hide-non-requirement"></label>
                        <span id="lbl-mfgoperation-hide-non-requirement" labelid="LblMfgOperationMaterialRequirementHideNonRequirement"></span>
                    </span>
                    <!-- <span class="mfgoperation-maximize" id="material-maximize">&nbsp;</span>-->
                </div>
            </div>
            <div id="mfgoperation-material-content" class="content">
                <div id="mfgoperation-materials-grid-container" class="mfgoperation-shopfloor-grid-container">
                    <table id="mfgoperation-materials-grid" class="mfgoperation-shopfloor-grid">
                        <thead>
                            <tr class="mfgoperation-ui-jqgrid-labels">
                                <th id="Product" class="mfgoperation-col-150">Product</th>
                                <th id="Status" class="mfgoperation-col-status">Status</th>
                                <th id="Lot" class="mfgoperation-col-150">Lot</th>
                                <th id="Qty">Qty</th>
                                <th id="Slot">Slot</th>
                                <th id="ProducingOrder">Producing Order</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                    <div id="mfgoperation-empty-state-materials" class="mfgoperation-empty-state-txt"></div>
                </div>
            </div>
        </div>
    </div>
</div>
