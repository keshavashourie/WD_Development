<aw-popup2>
    <aw-panel-body>
        <p class="copyright-info">
            {{ctx.momProductSettings.name}} v{{ctx.momProductSettings.version}}
        </p>
        <p class="copyright-info">
            &copy; {{ctx.currentYear}} {{ctx.momProductSettings.legalEntity}}
        </p>
        <aw-include
            name="{{ctx.momProductSettings.additionalInfo}}"
            exist-when="ctx.momProductSettings.additionalInfo"
        ></aw-include>
    </aw-panel-body>
    <aw-panel-footer>
        <aw-button action="closePopupWindow">{{i18n.close}}</aw-button>
    </aw-panel-footer>
</aw-popup2>
