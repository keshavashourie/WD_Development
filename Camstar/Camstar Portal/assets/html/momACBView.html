<aw-row>
    <aw-advanced-bar type="TOOLBAR" id="acbToolbar" negative>
        <aw-flex-row height="12" justify="left" wrap-style="nowrap" align-content="left">
            <div>
                <aw-command-bar anchor="momACBDefaultCommands" alignment="HORIZONTAL"></aw-command-bar>
            </div>
            <aw-flex-column visible-when="ctx.momAcbConfiguration.isSearchEnabled" justify="left" offset="1f" offset-right="1f" align-content="left" width="2">
                <aw-search-box prop="data.searchBox" placeholder="data.searchBoxPlaceHolder" action="doSearch"></aw-search-box>
            </aw-flex-column>
            <aw-flex-column justify="left" align-content="left">
                <aw-command-bar anchor="momACBCustomCommands" alignment="HORIZONTAL"></aw-command-bar>
            </aw-flex-column>
        </aw-flex-row>
    </aw-advanced-bar>
</aw-row>
<aw-row height="5f" visible-when="ctx.simpleFilterIsSelected">
    <aw-include name="momAcbFilter" style="margin-left: 15px;" exist-when="ctx.simpleFilterIsSelected"></aw-include>
</aw-row>
