<div class="aw-widgets-propertyContainer">
    <div class="aw-widgets-propertyLabelTopValueContainer">
        <div ng-if="!prop.isEditable">
            <aw-property-non-edit-val prop="prop"></aw-property-non-edit-val>
        </div>
        <div ng-if="prop.isEditable">
                <div class="mom-leftCommand-class">
                    <aw-icon-button id="leftCommand" command="command" visible-when="{{command.condition}}" ng-repeat="command in leftCommands"></aw-icon-button>
                </div>
                <div class="mom-numericInput-class">
                    <aw-numeric id ="momNumericInput" prop="prop"></aw-numeric>
                </div>
                <div class="mom-rightCommand-class">
                    <aw-icon-button id="rightCommand" command="command" visible-when="{{command.condition}}" ng-repeat="command in rightCommands"></aw-icon-button>
                </div>
        </div>
    </div>
</div>
