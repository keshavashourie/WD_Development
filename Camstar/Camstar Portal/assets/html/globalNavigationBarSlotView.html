<aw-flex-column>
    <!-- LHN (Top) Navigation Items Area -->
    <aw-flex-row height="fill">
        <aw-toolbar first-anchor="aw_globalNavigationbar" second-anchor="aw_userSessionbar" orientation="VERTICAL" reverse="false">
            <aw-column>
                <aw-row height="fill" justify="center" offset="0.33f">
                    <aw-row  style="height: 70%;">
                        <aw-command-bar style="height: 100%;" class="commandGlobalNavigationbar" anchor="aw_globalNavigationbar" alignment="VERTICAL">
                        </aw-command-bar>
                    </aw-row>
                    <aw-row height="fill" style="height: 30%;" align-content="end">
                        <aw-command-bar height="fill" style="height: 100%;" alignment="VERTICAL" anchor="aw_userSessionbar">
                        </aw-command-bar>
                    </aw-row>
                </aw-row>
            </aw-column>
        </aw-toolbar>
    </aw-flex-row>
</aw-flex-column>
