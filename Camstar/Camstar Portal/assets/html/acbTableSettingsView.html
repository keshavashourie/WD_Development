<div style="height: 350px;width: 270px;float: left;">
    <div class="aw-widgets-propertyLabelTop" style="float: left;height: 20px;">
        Available columns
    </div>
    <div id="rightSidePanel" style="height: 325px;width: 100%;border: #8080805e;border-style: solid;border-width: thin;float: left;">
        <aw-list id="rightSidePanelList" dataprovider="data.dataProviders.leftSideDataProvider">
            <aw-property-non-edit-val prop="item" class="ng-isolate-scope"></aw-property-non-edit-val>
        </aw-list>
    </div>
</div>
<div style="height: 350px;width: 60px;float: left;">
    <aw-command-bar style="padding-top: 80px !important;" anchor="mom_acbConfigCommandBar" show-command-labels="conditions.showLabels" reverse="conditions.reverseCommands" alignment="VERTICAL"></aw-command-bar>
</div>
<div style="height: 350px;width: 270px;float: left;">
    <div class="aw-widgets-propertyLabelTop" style="float: left;height: 20px;">
        Selected columns
    </div>
    <div id="leftSidePanel" style="height: 325px;width: 100%;border: #8080805e;border-style: solid;border-width: thin;float: left;">
        <aw-list id="leftSidePanelList" dataprovider="data.dataProviders.rightSideDataProvider">
            <aw-property-non-edit-val prop="item" class="ng-isolate-scope"></aw-property-non-edit-val>
        </aw-list>
    </div>
</div>
<div style="height: 350px;width: 30px;float: left;">
    <aw-command-bar style="padding-top: 130px !important;" anchor="mom_acbConfigCommandBarTableRight" show-command-labels="conditions.showLabels" reverse="conditions.reverseCommands" alignment="VERTICAL"></aw-command-bar>
</div>
