<div style="height: 350px;width:290px;">
    <div class="aw-widgets-propertyLabelTop" style="float: left;height: 20px;width: 100%;">
        Properties
    </div>
    <div id="rightSidePanelList" style="height: 325px;width: 270px;float: left;float:left;overflow-y: auto;overflow-x: hidden;">
        <div aw-repeat="item : data.listDataObject">
            <aw-listbox prop="item.acbListBox" list="item.acbListBoxValues.dbValue" action="updateTemplate"></aw-listbox>
        </div>
    </div>
</div>

    <aw-command-bar style="padding:10px;padding-top: 150px !important;" anchor="mom_acbConfigCommandBarList" show-command-labels="conditions.showLabels" reverse="conditions.reverseCommands" alignment="VERTICAL"></aw-command-bar>
</div>
<div style="height: 350px;width: 270px;float: left;">
    <div class="aw-widgets-propertyLabelTop" style="float: left;height: 20px;">
        Preview
    </div>
    <div id="leftSidePanelList" style="height: 325px;width: 100%;float: left;">
        <aw-include name="momACBPreview"></aw-include>
    </div>
</div>
