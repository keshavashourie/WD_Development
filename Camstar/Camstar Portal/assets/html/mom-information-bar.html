<div class="mom-information-bar" ng-class="['mom-information-bar-'+type, 'mom-information-bar-'+mode]">
    <!-- Image -->
    <div ng-class="iconClass" ng-bind-html="iconSvg" ng-if="iconSvg"></div>
    <!-- Contents -->
    <div class="mom-information-bar-contents" ng-if="label">
        <span class="mom-information-bar-label">{{label}}</span> <span class="mom-information-bar-text" ng-transclude></span>
        <a class="mom-information-bar-link" ng-click="execute(linkAction)" ng-if="linkText">{{linkText}}</a>
    </div>
    <div class="mom-information-bar-contents" ng-if="!label">
        <span class="mom-information-bar-text" ng-transclude></span>
        <a class="mom-information-bar-link" ng-click="execute(linkAction)" ng-if="linkText">{{linkText}}</a>
    </div>
</div>
