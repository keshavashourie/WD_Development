<div class="tree-control-command-bar">
    <div class="button-container">
        <button id="addTreeNodeButton"><span class="tree-button-new"><span class="group-command-indicator"></span></span></button>
        <button id="linkChildrenButton" class="command-button-icon"><span class="tree-button-link-children"></span></button>
        <button id="expandButton" class="icon"><span class="tree-button-expand"></span></button>
        <button id="collapseButton" class="command-button-icon"><span class="tree-button-collapse"></span></button>
        <button id="importButton" class="command-button-icon"><span class="tree-button-import"><span class="group-command-indicator"></span></span></button>
        <input id='valorExportFileInput' type='file' hidden accept=".xml" />
        <input id='srcExportFileInput' type='file' hidden accept=".json" />
    </div>

    <div class="search-input-container">
        <div class="cs-textbox">
            <input id="searchTreeCriteria" class="search-criteria-input" type="text" autocomplete="off">
            <div class="inline-search-buttons-container">
                <button id="searchClearButton"><span class="inline-search-clear-button"></span></button>
                <button id="searchExecuteButton"><span class="inline-search-execute-button"></span></button>
            </div>
        </div>
    </div>
    <div id="commandAddNewNodeList" class="dropdown-content-list"></div>
    <div id="commandImportList" class="dropdown-content-list"></div>
</div>
<div id="fhmTreeContainer" class="factory-hierarchy">
</div>
