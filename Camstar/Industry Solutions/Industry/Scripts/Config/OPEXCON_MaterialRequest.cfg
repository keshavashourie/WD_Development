<?xml version="1.0"?>
<CamstarLoadTester Version="2.9.20">
  <Username>
  </Username>
  <Password>
  </Password>
  <Host>localhost</Host>
  <Port>443</Port>
  <AutoSessionElement>True</AutoSessionElement>
  <AutoTXNGuid>False</AutoTXNGuid>
  <ParameterTemplateDelimiter>~|~</ParameterTemplateDelimiter>
  <CSVOutputDelimiter>,</CSVOutputDelimiter>
  <TestExecution>DirectToServer</TestExecution>
  <StopOnError>True</StopOnError>
  <ForceUTF16LE>False</ForceUTF16LE>
  <EnablePromptForInput>True</EnablePromptForInput>
  <DefaultPluginName>SubmitToServer</DefaultPluginName>
  <LogFileFolder>C:\Temp</LogFileFolder>
  <GlobalParameters>
    <GlobalParameter>
      <Name>PostUri2</Name>
      <Description>Do not modify this parameter</Description>
      <SubstitutionString>%PostUri2%</SubstitutionString>
      <SubstitutionValue>http://+:%ES_OmlPort2%/%WebAdapter2%/</SubstitutionValue>
    </GlobalParameter>
    <GlobalParameter>
      <Name>UserName</Name>
      <Description>User to use for submitting Opcenter Execution transactions</Description>
      <SubstitutionString>%UserName%</SubstitutionString>
      <SubstitutionValue>CamstarAdmin</SubstitutionValue>
    </GlobalParameter>
    <GlobalParameter>
      <Name>Password</Name>
      <Description>Password for the user for submitting Opcenter Execution transactions</Description>
      <SubstitutionString>%Password%</SubstitutionString>
      <SubstitutionValue>MoveContainerTo2024!()</SubstitutionValue>
    </GlobalParameter>
    <GlobalParameter>
      <Name>MIOClientGatewayName</Name>
      <Description>Name of the MIO Client Gateway</Description>
      <SubstitutionString>%MIOClientGatewayName%</SubstitutionString>
      <SubstitutionValue>mioclient</SubstitutionValue>
    </GlobalParameter>
    <GlobalParameter>
      <Name>MIOClientGatewayHostName</Name>
      <Description>Name of the server the MIO Client gateway is installed on</Description>
      <SubstitutionString>%MIOClientGatewayHostName%</SubstitutionString>
      <SubstitutionValue>GOAQACEP1151</SubstitutionValue>
    </GlobalParameter>
    <GlobalParameter>
      <Name>MIOHostNames</Name>
      <Description>Quoted, comma-delimited list of MIO Servers.  Example: "MIOServer1","MIOServer2"</Description>
      <SubstitutionString>%MIOHostNames%</SubstitutionString>
      <SubstitutionValue>"GOAQACEP1151"</SubstitutionValue>
    </GlobalParameter>
    <GlobalParameter>
      <Name>MMHost</Name>
      <Description>IP or name of the Valor Material Management Server REST API</Description>
      <SubstitutionString>%MMHost%</SubstitutionString>
      <SubstitutionValue>GOAQACEP2547.SWQA.TST</SubstitutionValue>
    </GlobalParameter>
    <GlobalParameter>
      <Name>PostUri</Name>
      <Description>Do not modify this parameter</Description>
      <SubstitutionString>%PostUri%</SubstitutionString>
      <SubstitutionValue>http://+:%ES_OmlPort%/%WebAdapter%/</SubstitutionValue>
    </GlobalParameter>
    <GlobalParameter>
      <Name>WebAdapter</Name>
      <Description>Name of the inbound Web API Adapter</Description>
      <SubstitutionString>%WebAdapter%</SubstitutionString>
      <SubstitutionValue>is_valorinbound</SubstitutionValue>
    </GlobalParameter>
    <GlobalParameter>
      <Name>ReserveURLPowerShellFileNameAndPath</Name>
      <Description>Do not modify this parameter</Description>
      <SubstitutionString>%ReserveURLPowerShellFileNameAndPath%</SubstitutionString>
      <SubstitutionValue>%RelativePath%\MIO Web API Adapter Reserve URL.ps1</SubstitutionValue>
    </GlobalParameter>
    <GlobalParameter>
      <Name>RelativePath</Name>
      <Description>Do not modify this parameter</Description>
      <SubstitutionString>%RelativePath%</SubstitutionString>
      <SubstitutionValue>C:\Program Files\Opcenter Execution Core\Transaction Tester\Scripts</SubstitutionValue>
    </GlobalParameter>
    <GlobalParameter>
      <Name>PortOut</Name>
      <Description>Port for Outbound Web API Client Adapter</Description>
      <SubstitutionString>%PortOut%</SubstitutionString>
      <SubstitutionValue>4402</SubstitutionValue>
    </GlobalParameter>
    <GlobalParameter>
      <Name>IP</Name>
      <Description>IP Address of the primary Opcenter Connect MOM Channel Adapter Host</Description>
      <SubstitutionString>%IP%</SubstitutionString>
      <SubstitutionValue>
      </SubstitutionValue>
    </GlobalParameter>
    <GlobalParameter>
      <Name>OpcenterConnectUserName</Name>
      <Description>Opcenter Connect MOM user name</Description>
      <SubstitutionString>%OpcenterConnectUserName%</SubstitutionString>
      <SubstitutionValue>CTT::UserName</SubstitutionValue>
    </GlobalParameter>
    <GlobalParameter>
      <Name>OpcenterConnectPassword</Name>
      <Description>Opcenter Connect MOM user password</Description>
      <SubstitutionString>%OpcenterConnectPassword%</SubstitutionString>
      <SubstitutionValue>CTT::Password</SubstitutionValue>
    </GlobalParameter>
    <GlobalParameter>
      <Name>OpcenterServer</Name>
      <Description>Name of the Opcenter Server</Description>
      <SubstitutionString>%OpcenterServer%</SubstitutionString>
      <SubstitutionValue>localhost</SubstitutionValue>
    </GlobalParameter>
    <GlobalParameter>
      <Name>OpcenterPort</Name>
      <Description>Port for server.  Use 443 for SSL, 80 for non-SSL</Description>
      <SubstitutionString>%OpcenterPort%</SubstitutionString>
      <SubstitutionValue>443</SubstitutionValue>
    </GlobalParameter>
  </GlobalParameters>
