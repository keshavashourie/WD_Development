                    <td class="AutoNumber_p__1bullet" valign="top" data-mc-autonum="&lt;span style=&quot;font-size: 120%;&quot; class=&quot;mcFormatSize&quot;&gt;•&lt;/span&gt;">固定转换为十进制或布尔型。</td>

            <p class="_1body">整数转换为固定、十进制、浮点或布尔型。例如，如果数量字段为固定类型，则不使用整数算术计算 Qty/4：将文本（字符串）4 提升为固定类型，并应用固定算术。</p>
            <p class="_1body">对于类似 Qty/4.0 的表达式，数量将提升为十进制类型，因为所有含浮点的文本均表示为“十进制”类型的值。然后，再应用十进制算术。</p>
