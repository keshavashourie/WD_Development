        <div role="main" id="mc-main-content">
            <p class="Head2">使用数字</p>
            <p class="_1body">如果要创建持久 CDO（具有关联数据库表的 CDO）的子类，则不允许创建表名称以数字开头的表。如果要保持 CDO 名称与其关联表之间的一致性，名称不要以数字开头。 </p>
            <p class="_1body">但是，可以在名称的任何其他部分中使用数字。例如，MyCDO1 而不是 1MyCDO。该规则也适用于 CDO 字段，因为它们转换为数据库列。</p>
