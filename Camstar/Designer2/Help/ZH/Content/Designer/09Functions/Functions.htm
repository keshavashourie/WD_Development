            <p class="Head2" data-mc-conditions="Primary.Online">函数</p>
            <p class="_1body">已编写函数来执行各种任务，如简单的算术、搜索复杂的数据结构、数据库查询、报告编写、数据收集、数据验证等等。</p>
            <p class="_1body">函数具有零个或更多参数，并且由 ActiveX 组件实施。包含在 CLF 中的函数可以执行工作。函数有权访问系统的内部对象设计，它通过操纵该设计来完成工作。 </p>
