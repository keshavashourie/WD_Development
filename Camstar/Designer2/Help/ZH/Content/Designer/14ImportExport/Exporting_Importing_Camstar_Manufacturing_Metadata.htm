            <p class="Head2" data-mc-conditions="Primary.Online">导入应用程序元数据</p>
            <p class="_1body">本章描述如何使用 Designer 的“导入”功能导入 Opcenter EX MDD 元数据配置或 Opcenter EX CR 元数据配置，以同步两个数据库。</p>
            <p class="_1body">元数据配置通过 XML 文档导入，XML 文档供 Simens 用于分发升级，并供顾问或第三方用于分发 Opcenter EX MDD 插件和 Opcenter EX CR 插件。</p>
